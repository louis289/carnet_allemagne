<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnet Scout - Bundeslager 2026</title>
    <meta name="description" content="Carnet de survie linguistique franco-allemand pour le Bundeslager 2026 – EDLN.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Bouton retour à la page d'accueil (masqué en impression) -->
    <div id="nav-bar" style="
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 999;
        background: rgba(10,22,40,0.95);
        backdrop-filter: blur(12px);
        padding: 10px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        font-family: 'Open Sans', sans-serif;
    ">
        <a href="landing.html" style="
            color: #EAB642;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.8;
            transition: opacity 0.2s;
        " onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.8'">
            ← Accueil
        </a>
        <div style="color: rgba(255,255,255,0.5); font-size: 12px;" id="nav-info"></div>
        <button onclick="window.print()" style="
            background: #114C2A;
            color: #EAB642;
            border: 1px solid rgba(234,182,66,0.4);
            border-radius: 50px;
            padding: 7px 18px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Open Sans', sans-serif;
            transition: all 0.2s;
        " onmouseover="this.style.background='#16663A'" onmouseout="this.style.background='#114C2A'">
            🖨️ Imprimer
        </button>
    </div>

    <!-- Le contenu sera généré dynamiquement ici par script.js -->
    <div id="app">
        <div class="loading">⏳ Chargement du carnet…</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
